name: Build and test native helpers
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm binutils
      - run: sh scripts/build-linux.sh
      - run: python3 tests/test_transport.py build/mistrimulti-helper-linux
      - run: python3 tests/test_packet_faults.py build/mistrimulti-helper-linux
      - uses: actions/upload-artifact@v4
        with:
          name: mistrimulti-linux-x64
          path: |
            build/mistrimulti-helper-linux
            build/mistrimulti-steam-id-linux
            LICENSE
            CONTACT.md
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install portable NASM
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip -OutFile nasm.zip
          Expand-Archive nasm.zip nasm-tools
          (Get-ChildItem nasm-tools -Filter nasm.exe -Recurse | Select-Object -First 1).DirectoryName | Add-Content $env:GITHUB_PATH
      - shell: pwsh
        run: ./scripts/Build.ps1 -Release
      - run: python tests/test_transport.py build/mistrimulti-helper.exe
      - run: python tests/test_packet_faults.py build/mistrimulti-helper.exe
      - uses: actions/upload-artifact@v4
        with:
          name: mistrimulti-windows-x64
          path: |
            build/mistrimulti-helper.exe
            build/mistrimulti-steam-id.exe
            LICENSE
            CONTACT.md
  updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm lld llvm wine64 xvfb
      - name: Release list is current
        run: sh scripts/make-release.sh && git diff --exit-code release/latest.txt
      - run: python3 scripts/lint-asm.py .
      - run: sh scripts/build-updater.sh
      - run: python3 tests/test_updater.py build/MistriMulti.exe
      - run: python3 tests/test_world.py build/MistriMulti.exe
      - uses: actions/upload-artifact@v4
        with:
          name: mistrimulti-manager
          path: build/MistriMulti.exe
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm lld llvm wine64 xvfb
      - run: python3 scripts/lint-asm.py .
      - run: sh scripts/build-launcher.sh
      - run: sh scripts/build-updater.sh
      - name: Build the Windows helper
        run: |
          sh scripts/winlibs.sh build/winlibs
          cd build
          nasm -f win64 -I ../helper/include/ ../helper/windows.asm -o helper-win.obj
          lld-link /nologo /machine:x64 /subsystem:console /entry:mistria_main /nodefaultlib /incremental:no /out:mistrimulti-helper.exe helper-win.obj /libpath:winlibs kernel32.lib ws2_32.lib shell32.lib
      - run: python3 tests/test_launcher.py build/MistriMultiLauncher.exe build/mistrimulti-helper.exe build/fakegame.exe build/MistriMulti.exe
      - uses: actions/upload-artifact@v4
        with:
          name: mistrimulti-launcher
          path: build/MistriMultiLauncher.exe
