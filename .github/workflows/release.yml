name: Release
# Builds the four Windows programs from the tagged commit, tests them, and publishes them with the list the manager
# downloads (latest.txt) as a GitHub Release. Scheme and URLs: docs/RELEASES.md.
#   git tag v0.2.0 && git push origin v0.2.0      (the tag must equal the version in mod/mistrimulti/manifest.toml)
# A manual run builds and tests everything and keeps the files as a workflow artifact without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm lld llvm wine64 xvfb
      - name: The tag is the mod version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' mod/mistrimulti/manifest.toml | head -n 1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME does not match the mod version $version" >&2; exit 1; }
      - name: The committed mod list is current
        run: sh scripts/make-release.sh && git diff --exit-code release/latest.txt
      - run: python3 scripts/lint-asm.py .
      - name: Build the four programs
        run: |
          sh scripts/build-updater.sh
          sh scripts/build-launcher.sh
          sh scripts/build-helper.sh
      - name: Tests
        run: |
          python3 tests/test_updater.py build/MistriMulti.exe build/fakegame.exe
          python3 tests/test_world.py build/MistriMulti.exe
          python3 tests/test_launcher.py build/MistriMultiLauncher.exe build/mistrimulti-helper.exe build/fakegame.exe build/MistriMulti.exe
      - name: Assemble the release files and the list
        run: |
          mkdir -p dist
          cp build/MistriMulti.exe build/MistriMultiLauncher.exe build/mistrimulti-helper.exe build/mistrimulti-steam-id.exe dist/
          sh scripts/make-release.sh --bin dist dist/latest.txt
          cat dist/latest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mistrimulti-release
          path: dist/
      - name: Publish (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Draft first, so "latest" never points at a release whose assets are still uploading.
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "MistriMulti ${GITHUB_REF_NAME#v}" \
            --notes "Update with MistriMulti.exe (Check for updates, then Update), or download the programs below. See docs/RELEASES.md." \
            dist/latest.txt dist/MistriMulti.exe dist/MistriMultiLauncher.exe dist/mistrimulti-helper.exe dist/mistrimulti-steam-id.exe
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
